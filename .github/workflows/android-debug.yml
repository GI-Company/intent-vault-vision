name: Android debug (model included)
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'huggingface_hub>=0.25,<2'
      - name: Bundle EmbeddingGemma (before APK packaging)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          EMBEDDINGGEMMA_REVISION: ${{ vars.EMBEDDINGGEMMA_REVISION || 'main' }}
        run: python scripts/prepare_model.py
      - run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Assert model exists inside APK
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/models/embeddinggemma-2-740m.litertlm'
      - uses: actions/upload-artifact@v4
        with:
          name: INTENT-Vault-Vision-debug-with-model
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
